<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pursuk · Madset Asistanı</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body class="chat-page">
  <main>
    <header class="chat-header"><div class="chat-identity"><img class="avatar" src="/porsuk.png" alt="" width="40" height="40"><div><h1>Pursuk</h1><p>Madset asistanın</p></div></div><button id="reset" type="button">Yeni sohbet</button></header>
    <div id="account-panel" aria-live="polite">Hesap bilgisi yükleniyor…</div>
    <section id="messages" role="log" aria-label="Sohbet" aria-live="polite"></section>
    <div id="suggestions" aria-label="Konuşma seçenekleri"><button type="button" data-action="madset-intro">Madset’i tanımak istiyorum</button><button type="button" data-action="help-intro">Kullanırken yardıma ihtiyacım var</button></div>
    <p id="error" role="alert" hidden></p>
    <form id="chat-form" hidden>
      <label for="message">Pursuk'a sor</label>
      <div class="composer"><textarea id="message" rows="2" maxlength="6000" placeholder="Mesajını yaz…" required></textarea><button id="send" type="submit">Gönder</button></div>
      <p class="note">Yanıt için mesajların Anthropic'e gönderilebilir. Hassas bilgi paylaşma.</p>
    </form>
  </main>
</body>
</html>
